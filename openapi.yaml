openapi: 3.0.0
info:
  title: Oficina Mecânica API
  version: 3.0.0
  description: |
    API de gestão de oficina mecânica.

    **Como autenticar:** chame `POST /auth` com o CPF de um cliente cadastrado,
    copie o `token` da resposta e use em **Authorize**.

servers:
  - url: https://q7m1gn8vqi.execute-api.us-east-1.amazonaws.com
    description: Produção (AWS API Gateway)
  - url: http://localhost:8000
    description: Local

tags:
  - name: Autenticação
  - name: Clientes
  - name: Veículos
  - name: Serviços
  - name: Insumos
  - name: Ordens de Serviço
  - name: Consulta Pública

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token devolvido por POST /auth (válido por 1 hora)
    sanctum:
      type: http
      scheme: bearer
      description: Token do login antigo (Fase 2), usado só em /api/logout

  schemas:
    Servico:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        valor: { type: number }

    Insumo:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        valor: { type: number }
        quantidade_estoque: { type: integer }

    Cliente:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        documento: { type: string }
        celular: { type: string, nullable: true }
        email: { type: string, nullable: true }

    Veiculo:
      type: object
      properties:
        id: { type: integer }
        placa: { type: string }
        marca: { type: string }
        modelo: { type: string }
        ano: { type: integer }
        cliente_id: { type: integer }

    OS:
      type: object
      properties:
        id: { type: integer }
        cliente_id: { type: integer }
        veiculo_id: { type: integer }
        descricao_problema: { type: string }
        filial: { type: string, example: MATRIZ }
        status_atual:
          type: object
          properties:
            id: { type: integer }
            nome: { type: string }
        created_at: { type: string, format: date-time }
        cliente:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nome: { type: string }
        veiculo:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            placa: { type: string }
        servicos:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: integer }
              servico_id: { type: integer }
              servico:
                type: object
                nullable: true
                properties:
                  id: { type: integer }
                  nome: { type: string }
                  valor: { type: number }
              insumos:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    insumo_id: { type: integer }
                    quantidade: { type: integer }
                    insumo:
                      type: object
                      nullable: true
                      properties:
                        id: { type: integer }
                        nome: { type: string }
                        valor: { type: number }
        historico_status:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: integer }
              status_id: { type: integer }
              status:
                type: object
                nullable: true
                properties:
                  id: { type: integer }
                  nome: { type: string }
              data_status: { type: string, format: date-time }

    Saga:
      type: object
      properties:
        saga_id: { type: string, format: uuid }
        os_id: { type: integer }
        correlation_id: { type: string }
        estado:
          type: string
          enum: [aguardando_orcamento, aguardando_aprovacao, reservando_estoque, aguardando_pagamento, aguardando_execucao, concluida, compensando, compensada, compensacao_falhou]
        ativa: { type: boolean }
        orcamento:
          type: object
          properties:
            id: { type: integer, nullable: true }
            valor_total: { type: integer, nullable: true, description: Em centavos }
            link_aprovacao: { type: string, nullable: true }
        pagamento:
          type: object
          properties:
            id: { type: integer, nullable: true }
            link_pagamento: { type: string, nullable: true }
        execucao_id: { type: string, nullable: true }
        estoque_baixado: { type: boolean }
        motivo_falha: { type: string, nullable: true }
        compensacoes_pendentes:
          type: array
          items: { type: string, enum: [estornar_pagamento, devolver_estoque, cancelar_orcamento, cancelar_os] }
        tentativas_compensacao: { type: integer }
        passos:
          type: array
          description: Linha do tempo com comandos enviados, eventos recebidos e compensações locais.
          items:
            type: object
            properties:
              passo: { type: string, example: billing.evt.orcamento-gerado }
              detalhes: { type: object }
              registrado_em: { type: string, format: date-time }

    Error:
      type: object
      properties:
        message: { type: string }

paths:
  # ── Autenticação ──────────────────────────────────────────────
  /auth:
    post:
      tags: [Autenticação]
      summary: Login por CPF (Lambda) — devolve o token JWT
      description: Atendida pela Lambda `authenticate` no API Gateway, não pela aplicação Laravel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string, example: '529.982.247-25' }
      responses:
        200:
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer, example: 3600 }
        400:
          description: CPF inválido
        404:
          description: Cliente não encontrado

  /api/login:
    post:
      tags: [Autenticação]
      summary: Login antigo por e-mail e senha (Fase 2)
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@oficina.com }
                password: { type: string, example: password }
      responses:
        200:
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        401:
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/logout:
    post:
      tags: [Autenticação]
      summary: Revogar token
      security: [{ sanctum: [] }]
      responses:
        200:
          description: Logout realizado
        401:
          description: Não autenticado

  # ── Clientes ──────────────────────────────────────────────────
  /api/clientes:
    post:
      tags: [Clientes]
      summary: Criar cliente
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, documento]
              properties:
                nome: { type: string, example: João Silva }
                documento: { type: string, example: "529.982.247-25", description: CPF ou CNPJ }
                celular: { type: string, example: "(11) 99999-9999" }
                email: { type: string, format: email }
      responses:
        201:
          description: Cliente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cliente' }
        422:
          description: CPF/CNPJ inválido ou duplicado
    get:
      tags: [Clientes]
      summary: Listar clientes
      security: [{ jwt: [] }]
      responses:
        200:
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Cliente' }

  /api/clientes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Clientes]
      summary: Buscar cliente
      security: [{ jwt: [] }]
      responses:
        200:
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cliente' }
        404:
          description: Não encontrado
    put:
      tags: [Clientes]
      summary: Atualizar cliente
      security: [{ jwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                celular: { type: string }
                email: { type: string, format: email }
      responses:
        200:
          description: Cliente atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cliente' }
    delete:
      tags: [Clientes]
      summary: Remover cliente
      security: [{ jwt: [] }]
      responses:
        204:
          description: Removido

  # ── Veículos ──────────────────────────────────────────────────
  /api/veiculos:
    post:
      tags: [Veículos]
      summary: Criar veículo
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placa, marca, modelo, ano, cliente_id]
              properties:
                placa: { type: string, example: "ABC-1234", description: "Formato antigo (ABC-1234) ou Mercosul (ABC1D23)" }
                marca: { type: string, example: Toyota }
                modelo: { type: string, example: Corolla }
                ano: { type: integer, example: 2020 }
                cliente_id: { type: integer, example: 1 }
      responses:
        201:
          description: Veículo criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Veiculo' }
        422:
          description: Placa inválida, duplicada ou cliente_id inexistente
    get:
      tags: [Veículos]
      summary: Listar veículos
      security: [{ jwt: [] }]
      responses:
        200:
          description: Lista de veículos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Veiculo' }

  /api/veiculos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Veículos]
      summary: Buscar veículo
      security: [{ jwt: [] }]
      responses:
        200:
          description: Veículo encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Veiculo' }
        404:
          description: Não encontrado
    put:
      tags: [Veículos]
      summary: Atualizar veículo
      security: [{ jwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                marca: { type: string }
                modelo: { type: string }
                ano: { type: integer }
      responses:
        200:
          description: Veículo atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Veiculo' }
    delete:
      tags: [Veículos]
      summary: Remover veículo
      security: [{ jwt: [] }]
      responses:
        204:
          description: Removido

  # ── Serviços ──────────────────────────────────────────────────
  /api/servicos:
    post:
      tags: [Serviços]
      summary: Criar serviço
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor]
              properties:
                nome: { type: string, example: Troca de óleo }
                valor: { type: number, example: 80.00 }
      responses:
        201:
          description: Serviço criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Servico' }
    get:
      tags: [Serviços]
      summary: Listar serviços
      security: [{ jwt: [] }]
      responses:
        200:
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Servico' }

  /api/servicos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Serviços]
      summary: Buscar serviço
      security: [{ jwt: [] }]
      responses:
        200:
          description: Serviço encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Servico' }
        404:
          description: Não encontrado
    put:
      tags: [Serviços]
      summary: Atualizar serviço
      security: [{ jwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                valor: { type: number }
      responses:
        200:
          description: Serviço atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Servico' }
    delete:
      tags: [Serviços]
      summary: Remover serviço
      security: [{ jwt: [] }]
      responses:
        204:
          description: Removido

  # ── Insumos ───────────────────────────────────────────────────
  /api/insumos:
    post:
      tags: [Insumos]
      summary: Criar insumo
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, valor, quantidade_estoque]
              properties:
                nome: { type: string, example: Filtro de óleo }
                valor: { type: number, example: 35.00 }
                quantidade_estoque: { type: integer, example: 50 }
      responses:
        201:
          description: Insumo criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Insumo' }
    get:
      tags: [Insumos]
      summary: Listar insumos
      security: [{ jwt: [] }]
      responses:
        200:
          description: Lista de insumos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Insumo' }

  /api/insumos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Insumos]
      summary: Buscar insumo
      security: [{ jwt: [] }]
      responses:
        200:
          description: Insumo encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Insumo' }
        404:
          description: Não encontrado
    put:
      tags: [Insumos]
      summary: Atualizar insumo
      security: [{ jwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                valor: { type: number }
                quantidade_estoque: { type: integer }
      responses:
        200:
          description: Insumo atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Insumo' }
    delete:
      tags: [Insumos]
      summary: Remover insumo
      security: [{ jwt: [] }]
      responses:
        204:
          description: Removido

  # ── Ordens de Serviço ─────────────────────────────────────────
  /api/os:
    post:
      tags: [Ordens de Serviço]
      summary: Criar OS
      description: O status inicial é definido automaticamente como Recebida.
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [veiculo_id, cliente_id, descricao_problema]
              properties:
                veiculo_id: { type: integer }
                cliente_id: { type: integer }
                descricao_problema: { type: string, example: Barulho no motor ao acelerar }
                filial:
                  type: string
                  description: Unidade que atende a OS (letras, números, - e _). Usada pela fila de execução.
                  default: MATRIZ
                  example: SP-CENTRO
                servicos:
                  type: array
                  description: >-
                    Serviços e peças (insumos) opcionais na abertura. Cada peça é
                    vinculada a um serviço.
                  items:
                    type: object
                    required: [servico_id]
                    properties:
                      servico_id: { type: integer }
                      insumos:
                        type: array
                        items:
                          type: object
                          required: [insumo_id]
                          properties:
                            insumo_id: { type: integer }
                            quantidade: { type: integer, minimum: 1, default: 1 }
      responses:
        201:
          description: OS criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OS' }
    get:
      tags: [Ordens de Serviço]
      summary: Listar OS
      description: >-
        Exclui da listagem as OS com status "Finalizada" e "Entregue".
        As demais são ordenadas por prioridade de status
        (Em execução > Aguardando aprovação > Em diagnóstico > Recebida) e,
        dentro de um mesmo status, da mais antiga para a mais recente (created_at ascendente).
        Filtros disponíveis por cliente_id, status_id e veiculo_id.
      security: [{ jwt: [] }]
      parameters:
        - name: cliente_id
          in: query
          schema: { type: integer }
        - name: status_id
          in: query
          schema: { type: integer }
        - name: veiculo_id
          in: query
          schema: { type: integer }
      responses:
        200:
          description: Lista de ordens de serviço
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OS' }

  /api/os/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Ordens de Serviço]
      summary: Detalhar OS
      description: Retorna a OS completa com serviços, insumos, histórico de status e orçamento.
      security: [{ jwt: [] }]
      responses:
        200:
          description: OS detalhada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OS' }
        404:
          description: Não encontrada

  /api/os/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Ordens de Serviço]
      summary: Alterar status
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_id]
              properties:
                status_id:
                  type: integer
                  description: "1=Recebida · 2=Em diagnóstico · 3=Aguardando aprovação · 4=Em execução · 5=Finalizada · 6=Entregue"
      responses:
        200:
          description: Status alterado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OS' }
        409:
          description: A OS tem uma Saga em andamento; o status é controlado pela Saga
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  saga_id: { type: string, format: uuid }
        422:
          description: Transição de status inválida

  /api/os/{id}/servicos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Ordens de Serviço]
      summary: Adicionar serviço à OS
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servico_id]
              properties:
                servico_id: { type: integer }
      responses:
        201:
          description: Serviço adicionado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      os_id: { type: integer }
                      servico_id: { type: integer }
        422:
          description: OS não encontrada ou serviço inválido

  /api/os/{id}/servicos/{osServicoId}/insumos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      - name: osServicoId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Ordens de Serviço]
      summary: Adicionar insumo ao serviço
      security: [{ jwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [insumo_id, quantidade]
              properties:
                insumo_id: { type: integer }
                quantidade: { type: integer, minimum: 1 }
      responses:
        201:
          description: Insumo adicionado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      os_servico_id: { type: integer }
                      insumo_id: { type: integer }
                      quantidade: { type: integer }
        422:
          description: Serviço não encontrado ou insumo inválido

  /api/os/{id}/orcamento:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Ordens de Serviço]
      summary: Solicitar orçamento (inicia a Saga)
      description: >-
        Inicia a Saga da OS: envia ao Billing Service o pedido de orçamento com os serviços e
        insumos e muda o status para Em diagnóstico. O orçamento, a aprovação pelo cliente e o
        pagamento acontecem no Billing; acompanhe pelo GET /api/os/{id}/saga.
      security: [{ jwt: [] }]
      responses:
        202:
          description: Saga iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      saga_id: { type: string, format: uuid }
                      os_id: { type: integer }
                      estado: { type: string, example: aguardando_orcamento }
                      acompanhar: { type: string, example: /api/os/42/saga }
        409:
          description: A OS já tem uma Saga em andamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  saga_id: { type: string, format: uuid }
        422:
          description: OS não encontrada ou sem serviços cadastrados

  /api/os/{id}/saga:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Ordens de Serviço]
      summary: Acompanhar a Saga da OS
      description: Estado da Saga mais recente da OS, links enviados ao cliente, compensações pendentes e linha do tempo.
      security: [{ jwt: [] }]
      responses:
        200:
          description: Saga encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Saga' }
        404:
          description: A OS não tem Saga

  /api/os/tempo-medio:
    get:
      tags: [Ordens de Serviço]
      summary: Tempo médio de execução
      description: Tempo médio em minutos entre os status Em execução e Finalizada.
      security: [{ jwt: [] }]
      responses:
        200:
          description: Tempo médio calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tempo_medio_minutos: { type: number, nullable: true }

  # ── Consulta Pública ──────────────────────────────────────────
  /api/consulta-publica:
    get:
      tags: [Consulta Pública]
      summary: Consultar status da OS
      description: Consulta pública por documento do cliente e placa do veículo, sem necessidade de autenticação.
      parameters:
        - name: documento
          in: query
          required: true
          schema: { type: string }
          example: "52998224725"
        - name: placa
          in: query
          required: true
          schema: { type: string }
          example: "ABC-1234"
      responses:
        200:
          description: OS encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status_atual: { type: string, example: "Em execução" }
                      descricao_problema: { type: string }
        404:
          description: Nenhuma OS encontrada para os dados informados
        422:
          description: Parâmetros documento e placa são obrigatórios

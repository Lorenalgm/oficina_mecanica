# TEMPLATE — copie para k8s/secret.yaml (git-ignored) e preencha os valores reais,
# OU deixe o Terraform (/infra) criar este Secret a partir de variáveis.
# NUNCA versione valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
type: Opaque
stringData:
  # Gere com: php artisan key:generate --show   (formato base64:...)
  APP_KEY: "base64:SUBSTITUA_PELA_SUA_APP_KEY"
  # Senha do Postgres (usada pela app e pelo StatefulSet do banco)
  DB_PASSWORD: "SUBSTITUA_PELA_SENHA_DO_BANCO"
  # Token do serviço externo Resend (variável sensível — exemplo do enunciado)
  RESEND_API_KEY: "SUBSTITUA_PELA_CHAVE_RESEND"

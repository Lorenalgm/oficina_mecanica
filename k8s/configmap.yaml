apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8080"
  LOG_CHANNEL: "stderr"

  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "oficina"
  DB_USERNAME: "oficina"

  CACHE_STORE: "file"
  SESSION_DRIVER: "file"
  QUEUE_CONNECTION: "sync"

  # Envio de e-mail via Resend. A chave sensível (RESEND_API_KEY) vem do Secret.
  # onboarding@resend.dev é o remetente de teste do Resend: funciona sem verificar
  # domínio, mas só entrega para o e-mail dono da conta. Em produção, troque por um
  # remetente de domínio verificado. Sem chave válida o envio falha e é apenas logado
  # (ver App\Listeners\EnviarEmailStatusOS), sem afetar a troca de status.
  MAIL_MAILER: "resend"
  MAIL_FROM_ADDRESS: "onboarding@resend.dev"
  MAIL_FROM_NAME: "Oficina Mecanica"

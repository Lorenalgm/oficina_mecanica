name: CD

on:
  push:
    branches: [main]

# Pipeline de entrega: build -> testes -> imagem (GHCR) -> deploy em kind efêmero
# -> smoke test. Independente do ci.yml (testes + SonarCloud) e do deploy no Railway.

env:
  IMAGE_NAME: ghcr.io/lorenalgm/oficina-api

jobs:
  tests:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pcov é necessário: o phpunit.xml configura relatório de cobertura,
          # e sem um driver o `php artisan test` sai com exit 1 mesmo com tudo verde.
          extensions: pcov, pdo, pdo_sqlite, zip, mbstring, bcmath
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Imagem & Deploy (kind efêmero)
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Criar cluster kind efêmero
        uses: helm/kind-action@v1
        with:
          cluster_name: oficina

      - name: Carregar a imagem no kind
        run: kind load docker-image "${IMAGE_NAME}:${GITHUB_SHA}" --name oficina

      - name: Instalar metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Provisionar namespace, secret e banco
        run: |
          kubectl create namespace oficina
          kubectl -n oficina create secret generic oficina-api-secrets \
            --from-literal=APP_KEY="base64:$(openssl rand -base64 32)" \
            --from-literal=DB_PASSWORD="ci-postgres-pass" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          kubectl apply -f k8s/postgres.yaml
          kubectl -n oficina rollout status statefulset/postgres --timeout=180s

      - name: Aplicar manifestos da aplicação (imagem do commit)
        run: |
          cd k8s
          kubectl kustomize . \
            | sed "s#${IMAGE_NAME}:latest#${IMAGE_NAME}:${GITHUB_SHA}#g" \
            | kubectl apply -f -
          kubectl -n oficina rollout status deployment/oficina-api --timeout=180s

      - name: Smoke test (GET /up)
        run: |
          kubectl -n oficina run smoke --image=curlimages/curl:8.10.1 \
            --restart=Never --rm -i --quiet --command -- \
            curl -fsS http://oficina-api/up
